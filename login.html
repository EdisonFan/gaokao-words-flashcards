<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>登录 · 高考3500词闪卡</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{--primary:#4472c4;--red:#c00000;--green:#0a8a4a;--text:#1f2937;--muted:#6b7280;--border:#e5e7eb}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(135deg,#4472c4,#2e5aa0);color:var(--text);line-height:1.6;
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:#fff;border-radius:16px;padding:36px 30px;width:100%;max-width:400px;
  box-shadow:0 12px 40px rgba(0,0,0,.2)}
.logo{text-align:center;font-size:34px;margin-bottom:6px}
h1{text-align:center;font-size:21px;margin-bottom:6px}
.sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:24px}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px;color:#374151}
input{width:100%;padding:13px 14px;font-size:16px;border:2px solid var(--border);border-radius:9px;outline:none}
input:focus{border-color:var(--primary)}
button{width:100%;margin-top:22px;padding:14px;font-size:16px;font-weight:700;color:#fff;
  background:var(--primary);border:none;border-radius:9px;cursor:pointer;transition:.15s}
button:hover{filter:brightness(1.05)}
button:disabled{opacity:.6;cursor:not-allowed}
.msg{margin-top:14px;padding:10px 12px;border-radius:8px;font-size:13px;display:none}
.msg.err{display:block;background:#fde8e8;color:var(--red)}
.msg.ok{display:block;background:#e6f7ef;color:var(--green)}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}
@media(max-width:600px){.box{padding:28px 20px}}
</style>
</head>
<body>
<div class="box">
<div class="logo">🎴</div>
<h1>高考3500词 · 闪卡学习</h1>
<div class="sub">请先登录，未登录无法访问</div>

<label for="username">用户名</label>
<input id="username" placeholder="请输入用户名" autocomplete="username" autofocus>

<label for="password">密码</label>
<input id="password" type="password" placeholder="请输入密码" autocomplete="current-password">

<button id="loginBtn">登 录</button>
<div class="msg" id="msg"></div>
<div class="foot">账号由管理员分配</div>
</div>

<script>
const SUPA_URL='https://vrpfpjlhqqsgbgpuxeqf.supabase.co';
const KEY='sb_publishable_q6KSt9ZKO7Ql5uKrMrIWyQ_07t42Lwp';
const sb=supabase.createClient(SUPA_URL,KEY);
const AUTH_KEY='auth_user';

function nextPage(){
  const p=new URLSearchParams(location.search).get('next');
  // 只允许跳到本目录内的页面，防止开放重定向
  return (p && /^[A-Za-z0-9_.-]+\.html$/.test(p)) ? p : 'index.html';
}
function showMsg(t,type){
  const m=document.getElementById('msg');
  m.textContent=t; m.className='msg '+type;
}
async function doLogin(){
  const username=document.getElementById('username').value.trim();
  const password=document.getElementById('password').value;
  const btn=document.getElementById('loginBtn');
  if(!username||!password){showMsg('请输入用户名和密码','err');return;}
  btn.disabled=true; btn.textContent='登录中…';
  const {data,error}=await sb.from('users').select('client_id,username,display_name,password').eq('username',username).maybeSingle();
  if(error){showMsg('登录失败：'+error.message,'err');btn.disabled=false;btn.textContent='登 录';return;}
  if(!data){showMsg('用户名或密码错误','err');btn.disabled=false;btn.textContent='登 录';return;}
  if(data.password!==password){showMsg('用户名或密码错误','err');btn.disabled=false;btn.textContent='登 录';return;}
  // 登录成功：写入身份，闪卡页据此关联进度
  const user={client_id:data.client_id,username:data.username,display_name:data.display_name||data.username};
  localStorage.setItem(AUTH_KEY,JSON.stringify(user));
  localStorage.setItem('fc_client_id',data.client_id);
  showMsg('登录成功，正在跳转…','ok');
  setTimeout(()=>location.href=nextPage(),400);
}
document.getElementById('loginBtn').onclick=doLogin;
document.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
// 已登录则直接进主页
try{
  const u=JSON.parse(localStorage.getItem(AUTH_KEY)||'null');
  if(u&&u.client_id&&u.username){location.replace(nextPage());}
}catch(e){}
</script>
</body></html>
